packages:
  # Global mise tools for every OS, as `mise use -g` specs. Installed by
  # run_onchange_after_install-mise-tools.sh.tmpl.
  #
  # Node CLIs go here, never `npm install -g`: an npm -g package lives in one
  # Node version's prefix and drops off PATH wherever mise selects another.
  # `npm:` tools get their own directory but still run on the active Node, so
  # a project pinned below a tool's `engines` minimum can break it. codex and
  # pi use mise's registry names, which resolve to native release binaries
  # and do not need Node at all.
  #
  # Language servers are for ttt. gopls is a native binary and uses the
  # project's go only to load packages. ttt runs TypeScript 7's `tsc --lsp`
  # (the `tsc` on PATH), which checks every project with 7. For a project
  # that needs its own 5.x or 6, bin/typescript-ls runs
  # typescript-language-server on LTS Node and falls back to TypeScript 6
  # (the last release with tsserver.js).
  mise:
    - 'node@lts'
    - 'go'
    - 'python@3.14'
    - 'codex'
    - 'pi'
    - 'github:tailscale/aperture-cli'
    - 'npm:skills'
    - 'npm:zombie-mermaid'
    - 'go:golang.org/x/tools/gopls'
    - 'npm:typescript-language-server'
    - 'npm:typescript@7 npm:typescript@6'

  darwin:
    brews:
      # QUALITY OF LIFE
      - 'atuin'
      - 'bash'
      - 'chezmoi'
      - 'fd'
      - 'fish'
      - 'fzf'
      - 'helix'
      - 'herdr'
      - 'htop'
      - 'jump'
      # mdcat renders markdown; symlinked in bin/ as mdless (pager) and
      # mdpick (fzf picker), which is what fzf is here for.
      - 'mdcat'
      - 'mosh'
      - 'ripgrep'
      - 'tmux'
      - 'eugenioenko/ttt/ttt'
      # DEV TOOLING
      - 'awscli'
      - 'curl'
      - 'direnv'
      - 'fx'
      - 'gh'
      - 'git'
      - 'git-filter-repo'
      - 'jq'
      - 'kcat'
      - 'mise'
      - 'libpq'
      - 'nmap'
      - 'tcpflow'
      - 'watch'
      - 'uv'
      - 'xan'
      - 'yq'
    casks:
      - '1password'
      - '1password-cli' #should be covered by the pre-install script, but shrug
      - 'antigravity-cli'
      # - 'cardhop'
      # - 'daisydisk'
      # - 'dash'
      # - 'discord'
      - 'dropbox'
      - 'fantastical'
      # - 'fastmail'
      - 'firefox'
      - 'fluidvoice'
      - 'ghostty'
      - 'hyperkey'
      - 'jetbrains-toolbox'
      - 'jump-desktop'
      - 'kaleidoscope'
      - 'keka'
      - 'intellij-idea'
      # - 'itsycal'
      - 'nickustinov/tap/itsypad'
      # - 'launchbar'
      - 'little-snitch'
      - 'orbstack'
      - 'pdf-expert'
      # - 'rectangle-pro'
      # - 'slack'
      - 'zed'
      - 'zoom'

  linux:
    # apt packages, installed by run_onchange_before_linux-install-packages.sh.tmpl
    # (which also installs mise, uv and Claude Code).
    packages:
      # QUALITY OF LIFE
      - 'bash'
      - 'fd-find'  # the command is fdfind; bin/symlink_fd.tmpl adds fd
      - 'fish'
      - 'fzf'
      - 'htop'
      - 'hx'  # helix
      - 'mosh'
      - 'neovim'
      - 'ripgrep'
      - 'tmux'
      # DEV TOOLING
      - 'awscli'
      - 'curl'
      - 'direnv'
      - 'git'
      - 'git-filter-repo'
      - 'jq'
      - 'kcat'
      - 'nmap'
      - 'postgresql-client'  # psql; the libpq formula on macOS
      - 'tcpflow'
    # Linux-only `mise use -g` specs, installed after packages.mise. Tools that
    # Ubuntu lacks, ships old, or ships as a different program (its yq is a
    # Python jq wrapper). macOS gets these from Homebrew.
    mise:
      - 'atuin'
      - 'fx'
      - 'gh'
      - 'yq'
      - 'github:medialab/xan'
      - 'github:gsamokovarov/jump'
