packages:
  darwin:
    brews:
      # QUALITY OF LIFE
      - 'atuin'
      - 'bash'
      - 'fd'
      - 'fish'
      - 'fzf'
      - 'helix'
      - 'htop'
      - 'jump'
      # mdcat renders markdown; symlinked in bin/ as mdless (pager) and
      # mdpick (fzf picker), which is what fzf is here for.
      - 'mdcat'
      - 'mosh'
      - 'ripgrep'
      - 'tmux'
      # DEV TOOLING
      - 'awscli'
      - 'curl'
      - 'direnv'
      - 'fx'
      - 'gh'
      - 'git'
      - 'jq'
      - 'kcat'
      - 'mise'
      - 'libpq'
      - 'nmap'
      - 'skills'
      - 'tcpflow'
      - 'watch'
      - 'uv'
      - 'xan'
      - 'yq'
      # LANGUAGES (use mise for most)
      - 'ghc'
      # node is brew-managed, not mise-managed, on purpose: globally
      # installed npm CLIs (pi) live in the runtime's prefix, and a
      # mise version switch would strip them. It was previously present
      # only as a transitive dependency of skills.
      - 'node'
    casks:
      - '1password'
      - '1password-cli' #should be covered by the pre-install script, but shrug
      - 'cardhop'
      - 'daisydisk'
      - 'dash'
      - 'discord'
      - 'dropbox'
      - 'fantastical'
      - 'fastmail'
      - 'firefox'
      - 'ghostty'
      - 'hyperkey'
      - 'jetbrains-toolbox'
      - 'jump-desktop'
      - 'kaleidoscope'
      - 'keka'
      - 'intellij-idea'
      - 'itsycal'
      - 'nickustinov/tap/itsypad'
      - 'launchbar'
      - 'little-snitch'
      - 'orbstack'
      - 'pdf-expert'
      - 'rectangle-pro'
      - 'slack'
      - 'tailscale-app'
      - 'zed'
      - 'zoom'

  linux:
    # Core CLI tools (available on most distros)
    packages:
      # QUALITY OF LIFE
      - 'bash'
      - 'fish'
      - 'htop'
      - 'neovim'
      - 'ripgrep'
      - 'tmux'
      # DEV TOOLING
      - 'awscli'
      - 'curl'
      - 'direnv'
      - 'git'
      - 'jq'
      - 'nmap'
      # Note: mise, uv, xan, yq, jump may need separate installation
      # See run_onchange_linux-install-packages.sh.tmpl

