packages:
  # Global mise tools for every OS, as `mise use -g` specs. Installed by
  # run_onchange_after_install-mise-tools.sh.tmpl.
  #
  # Node CLIs go here, never `npm install -g`: an npm -g package lives in one
  # Node version's prefix and drops off PATH wherever mise selects another.
  # `npm:` tools get their own directory but still run on the active Node, so
  # a project pinned below a tool's `engines` minimum can break it. codex and
  # pi use mise's registry names, which resolve to native release binaries
  # and do not need Node at all.
  #
  # Language servers are for ttt. gopls is a native binary and uses the
  # project's go only to load packages. typescript-language-server runs
  # through bin/typescript-ls, which pins it to LTS Node and falls back to
  # TypeScript 6 (the last release with tsserver.js); `tsc` on PATH is 7.
  mise:
    - 'node@lts'
    - 'go'
    - 'python@3.14'
    - 'codex'
    - 'pi'
    - 'github:tailscale/aperture-cli'
    - 'npm:skills'
    - 'npm:zombie-mermaid'
    - 'go:golang.org/x/tools/gopls'
    - 'npm:typescript-language-server'
    - 'npm:typescript@7 npm:typescript@6'

  darwin:
    brews:
      # QUALITY OF LIFE
      - 'atuin'
      - 'bash'
      - 'chezmoi'
      - 'fd'
      - 'fish'
      - 'fzf'
      - 'helix'
      - 'herdr'
      - 'htop'
      - 'jump'
      # mdcat renders markdown; symlinked in bin/ as mdless (pager) and
      # mdpick (fzf picker), which is what fzf is here for.
      - 'mdcat'
      - 'mosh'
      - 'ripgrep'
      - 'tmux'
      - 'eugenioenko/ttt/ttt'
      # DEV TOOLING
      - 'awscli'
      - 'curl'
      - 'direnv'
      - 'fx'
      - 'gh'
      - 'git'
      - 'git-filter-repo'
      - 'jq'
      - 'kcat'
      - 'mise'
      - 'libpq'
      - 'nmap'
      - 'tcpflow'
      - 'watch'
      - 'uv'
      - 'xan'
      - 'yq'
    casks:
      - '1password'
      - '1password-cli' #should be covered by the pre-install script, but shrug
      - 'cardhop'
      - 'daisydisk'
      - 'dash'
      - 'discord'
      - 'dropbox'
      - 'fantastical'
      - 'fastmail'
      - 'firefox'
      - 'fluidvoice'
      - 'ghostty'
      - 'hyperkey'
      - 'jetbrains-toolbox'
      - 'jump-desktop'
      - 'kaleidoscope'
      - 'keka'
      - 'intellij-idea'
      - 'itsycal'
      - 'nickustinov/tap/itsypad'
      - 'launchbar'
      - 'little-snitch'
      - 'orbstack'
      - 'pdf-expert'
      - 'rectangle-pro'
      - 'slack'
      - 'tailscale-app'
      - 'zed'
      - 'zoom'

  linux:
    # Core CLI tools (available on most distros)
    packages:
      # QUALITY OF LIFE
      - 'bash'
      - 'fish'
      - 'htop'
      - 'neovim'
      - 'ripgrep'
      - 'tmux'
      # DEV TOOLING
      - 'awscli'
      - 'curl'
      - 'direnv'
      - 'git'
      - 'jq'
      - 'nmap'
      # Note: mise, uv, xan, yq, jump may need separate installation
      # See run_onchange_linux-install-packages.sh.tmpl

