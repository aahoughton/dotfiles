# Mouse selects panes/windows, resizes, scrolls into copy mode; drag copies.
# Shift-drag bypasses tmux for the terminal's own selection.
set -g mouse on

# Copies (tmux's and OSC 52 from apps in panes) reach the system clipboard.
set -g set-clipboard on

# Assume every outer terminal accepts OSC 52, not only TERM=xterm*.
set -as terminal-features ',*:clipboard'

# Modified Enter keys (Shift+Enter newline, Alt+Enter queue in pi) need tmux
# to report modified keys distinctly; with this off they arrive as plain Enter.
set -g extended-keys on

# pi prefers the csi-u format, but the option only exists in tmux >= 3.5; on
# 3.2-3.4 tmux uses the xterm format instead, which pi also supports. The
# guard compares #{version} against 3.5 and expands to false on older tmux.
if-shell 'test "$(printf "%s\n3.5\n" "#{version}" | sort -V | head -n1)" = "3.5"' 'set -g extended-keys-format csi-u'
