# Local LLM model lock manifest.
#
# Records exactly which weights this machine runs, pinned to immutable Hugging
# Face revisions and verified by SHA-256. `restore-models.sh` reads this file to
# rebuild the active model tree from the Dropbox archive, or from Hugging Face
# if the archive is unavailable.
#
# Weights themselves are never stored in chezmoi (they are tens of GB); only
# this manifest is. Paths use ~ and are expanded by the consuming script.

active_root: ~/Models/LLM
archive_root: ~/Dropbox/Media/Local-LLM-Archive

# Minimum llama.cpp build: the oldest one the primary has been run on, with
# MTP, through llama-serve.sh. Older builds may lack its architecture
# (qwen35moe) and refuse to load it with an "unknown model architecture" error.
min_llama_cpp: "0.7.0"

# Each model carries its own sampling defaults, from its model card.
# llama-serve.sh passes the primary's as server defaults; a request that sets
# its own sampling parameters overrides them.

models:
  - name: qwen3.8-27b
    role: candidate
    # Kept as the fallback to swap back to. llama-serve.sh only ever loads
    # role: primary.
    repo: unsloth/Qwen3.8-27B-GGUF
    revision: 4ca720788d1e01f1bff70c033e0d0028fd02e502
    # Short revision is the on-disk directory name under <root>/<repo>/.
    revision_short: 4ca720788d1e
    quant: Q8_0
    upstream_repo: Qwen/Qwen3.8-27B
    upstream_revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
    license: Apache-2.0
    arch: qwen35
    sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
    files:
      - name: Qwen3.8-27B-Q8_0.gguf
        role: weights
        bytes: 29047086048
        sha256: a680f44a06920e5d689774823782006aa3acc8db95750323373b24139b67e348
      - name: mmproj-F16.gguf
        # F16 rather than BF16: better-exercised path on Metal.
        role: mmproj
        bytes: 927607488
        sha256: cbb841a9ee0636b2ec172f5bb8df2ea8dfeb01e90fe7c6126581d662a0b4e43e

  - name: swift-qwen3.8-27b
    role: candidate
    # Third-party fine-tune of Qwen/Qwen3.8-27B, trained to emit fewer
    # reasoning tokens. Carries the same MTP head (blk.64.nextn.*) as the base
    # model, so llama-serve.sh's speculative-decoding flags apply unchanged.
    repo: ukisai/Swift-Qwen3.8-27B-GGUF
    revision: b12fc8f44af7bdf31a3c3309891acb345d3106a2
    revision_short: b12fc8f44af7
    quant: Q8_0
    upstream_repo: ukisai/Swift-Qwen3.8-27b
    upstream_revision: 1b30aaaf753fe5c1cb51ada2ea0367a53445359c
    # Custom terms where the primary is Apache-2.0: free below US$1M annual
    # revenue, paid license above it. The base model underneath is still
    # Qwen/Qwen3.8-27B.
    license: LicenseRef-Swift-Open-License-1.0
    arch: qwen35
    sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
    files:
      - name: Swift-Qwen3.8-27B-Q8_0.gguf
        role: weights
        bytes: 29116389280
        sha256: 83cc7e31e095fbf0a12ff8f883f97e6e399192be74244c06c470affcd1b51b70
      - name: mmproj-Swift-Qwen3.8-27B-F16.gguf
        role: mmproj
        bytes: 927606976
        sha256: daa1116c9422fa390cc8688495da0e91781f92841dfc3b31a378ff252571745a

  - name: ornith-1.5-35b-a3b
    role: primary
    # Mixture of experts, 35B total and about 3B active per token, so it
    # decodes several times faster than the dense 27B models above. Carries
    # one MTP layer (blk.40.nextn.*), so the speculative-decoding flags apply.
    repo: ornith-ai/Ornith-1.5-35B-A3B-GGUF
    revision: 12393612fd4f730ff5aadc23e9b8f9648aa49ceb
    revision_short: 12393612fd4f
    quant: Q8_0
    upstream_repo: ornith-ai/Ornith-1.5-35B-A3B
    # The GGUF repo does not record which upstream revision it was converted
    # from. This is the upstream revision current when the GGUFs were published.
    upstream_revision: 10fbf86fed7ecee4a061f8b499a618f46001cac1
    license: MIT
    arch: qwen35moe
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
    files:
      - name: Ornith-1.5-35B-Q8_0.gguf
        role: weights
        bytes: 37802149280
        sha256: de46c4baf4b4dd85ea438bb0f757f21c38841a353506579979bba114311658c3
      - name: mmproj-Ornith-1.5-35B-BF16.gguf
